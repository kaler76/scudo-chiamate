name: Compila APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ScudoChiamate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScudoChiamate.apk
      - name: Pubblica come release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Scudo Chiamate ${{ github.run_number }}
          make_latest: true
          files: ScudoChiamate.apk
