plugins {
    id 'com.android.application'
}

android {
    namespace 'it.scudo.chiamate'
    compileSdk 34

    defaultConfig {
        applicationId 'it.scudo.chiamate'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Chiave fissa: così ogni nuova versione si installa sopra la precedente.
    signingConfigs {
        fissa {
            storeFile file('scudo.keystore')
            storePassword 'scudo123'
            keyAlias 'scudo'
            keyPassword 'scudo123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fissa }
        release { minifyEnabled false; signingConfig signingConfigs.fissa }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
